<meta charset="utf-8">
<title>unfoldingWord Platform Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap">
<style>
    :root{
      --bg:#F4F8FA; --surface:#FFFFFF; --ink:#231F20; --muted:#5A6E7A; --line:#C4D3DB;
      --ocean:#014263; --ocean-ink:#E8F4FA; --inspire:#31ADE3; --inspire-soft:#E3F3FB;
      --cultivate:#4FA9AC; --cultivate-soft:#E4F4F4; --kindle:#C97F14; --kindle-soft:#FBEFDC;
      --sink:#0A2E44;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--ink);
      font-family:'Nunito Sans','Avenir','Montserrat',sans-serif;font-size:13.5px;line-height:1.5;
      -webkit-font-smoothing:antialiased;}
    a{color:var(--inspire);text-decoration:none;} a:hover{color:var(--ocean);text-decoration:underline;}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
    svg{display:block;}

    .app{width:1440px;height:1000px;display:flex;overflow:hidden;background:var(--bg);}

    /* ---------- sidebar ---------- */
    .side{width:262px;flex:0 0 262px;background:var(--ocean);color:var(--ocean-ink);
      display:flex;flex-direction:column;padding:0;}
    .brand{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.14);}
    .brand img{height:20px;width:auto;filter:brightness(0) invert(1);opacity:.95;}
    .brand .bt{font-weight:800;font-size:13px;letter-spacing:.02em;line-height:1.15;padding-left:9px;margin-left:2px;border-left:1px solid rgba(255,255,255,.22);}
    .brand .bs{font-size:10.5px;opacity:.62;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
    .navwrap{flex:1;padding:8px 8px 6px;display:flex;flex-direction:column;gap:1px;overflow:hidden;}
    .grp{display:flex;align-items:flex-start;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.11em;
      text-transform:uppercase;color:var(--ocean-ink);opacity:.5;padding:9px 8px 3px;line-height:1.35;
      white-space:normal;border-radius:5px;cursor:pointer;}
    .grp:hover{opacity:.95;background:rgba(255,255,255,.06);text-decoration:none;color:var(--ocean-ink);}
    .grp .ga{width:11px;height:11px;flex:0 0 11px;stroke:currentColor;stroke-width:2.4;fill:none;margin-left:auto;opacity:0;margin-top:1px;}
    .grp:hover .ga{opacity:.8;}
    .grp .gn{color:var(--inspire);opacity:.95;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;}
    .ni{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:5px;
      color:var(--ocean-ink);opacity:.78;font-weight:600;font-size:12.5px;white-space:nowrap;}
    .ni svg{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;stroke-width:1.7;fill:none;
      stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
    .ni:hover{background:rgba(255,255,255,.07);opacity:1;text-decoration:none;color:var(--ocean-ink);}
    .ni.on{background:var(--inspire);color:#04222F;opacity:1;font-weight:800;}
    .ni.on svg{opacity:1;}
    .nempty{font-size:10.5px;font-weight:600;opacity:.4;padding:3px 8px 5px;font-style:italic;}
    .ni .nc{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;opacity:.45;font-weight:700;}
    .ni.on .nc{opacity:.6;}
    .ni .pill{margin-left:6px;background:rgba(255,255,255,.16);border-radius:20px;
      padding:0 6px;font-size:10px;font-weight:800;}
    .ni.on .pill{background:rgba(0,0,0,.16);}
    .sfoot{border-top:1px solid rgba(255,255,255,.14);padding:10px 14px;display:flex;align-items:center;gap:9px;}
    .av{width:26px;height:26px;border-radius:50%;background:var(--cultivate);color:#04222F;
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
    .sfoot .n{font-weight:700;font-size:12px;} .sfoot .r{font-size:10.5px;opacity:.6;}

    /* ---------- top bar ---------- */
    .main{flex:1;display:flex;flex-direction:column;min-width:0;}
    .top{height:56px;flex:0 0 56px;background:var(--surface);border-bottom:1px solid var(--line);
      display:flex;align-items:center;gap:14px;padding:0 20px;}
    .crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;}
    .crumb b{color:var(--ink);font-weight:800;font-size:14.5px;}
    .crumb .sep{opacity:.5;}
    .jd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:700;
      background:var(--inspire-soft);color:var(--ocean);border-radius:4px;padding:1px 5px;}
    .search{margin-left:auto;display:flex;align-items:center;gap:7px;width:280px;height:32px;
      border:1px solid var(--line);border-radius:6px;padding:0 10px;color:var(--muted);background:var(--bg);}
    .search svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;}
    .search .k{margin-left:auto;font-size:10px;font-weight:700;border:1px solid var(--line);
      border-radius:3px;padding:0 4px;background:var(--surface);}
    .tacts{display:flex;align-items:center;gap:8px;}

    /* ---------- content ---------- */
    .body{flex:1;overflow:auto;padding:20px 24px 28px;}
    .phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;}
    .eyebrow{color:var(--inspire);font-weight:800;font-size:10.5px;letter-spacing:.14em;
      text-transform:uppercase;margin:0 0 3px;}
    h1{font-weight:900;font-size:24px;line-height:1.15;margin:0;letter-spacing:-.01em;}
    .lede{color:var(--muted);margin:5px 0 0;max-width:72ch;font-size:13px;}
    h2{font-weight:800;font-size:15px;margin:0;}
    h3{font-weight:800;font-size:12.5px;margin:0;}

    .grid{display:grid;gap:14px;}
    .row{display:flex;gap:14px;}

    .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
      display:flex;flex-direction:column;min-width:0;}
    .chd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);}
    .chd .sub{color:var(--muted);font-size:11.5px;font-weight:600;}
    .chd .r{margin-left:auto;display:flex;align-items:center;gap:7px;}
    .cbd{padding:13px 14px;}
    .cbd.flush{padding:0;overflow-x:auto;}

    /* ---------- controls ---------- */
    .btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;
      border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12px;color:var(--ink);}
    .btn:hover{border-color:var(--inspire);color:var(--ocean);}
    .btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .btn.p{background:var(--inspire);border-color:var(--inspire);color:#04222F;}
    .btn.p:hover{background:#1E9AD0;border-color:#1E9AD0;color:#04222F;}
    .btn.q{border-color:transparent;background:transparent;color:var(--muted);}
    .btn.q:hover{background:var(--bg);color:var(--ink);}
    .btn.sm{height:24px;padding:0 8px;font-size:11px;}
    .btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;}
    .btn.off:hover{border-color:var(--line);color:var(--ink);}

    .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);}
    .tab{padding:7px 12px 8px;font-weight:700;font-size:12.5px;color:var(--muted);
      border-bottom:2px solid transparent;margin-bottom:-1px;}
    .tab:hover{color:var(--ink);}
    .tab.on{color:var(--ocean);border-bottom-color:var(--inspire);}

    .chips{display:flex;flex-wrap:wrap;gap:6px;}
    .chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:20px;
      border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;color:var(--muted);}
    .chip:hover{border-color:var(--inspire);color:var(--ocean);}
    .chip.on{background:var(--inspire-soft);border-color:var(--inspire);color:var(--ocean);}

    .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);}
    .seg button{padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--muted);border-right:1px solid var(--line);}
    .seg button:last-child{border-right:0;}
    .seg button.on{background:var(--ocean);color:#fff;}

    .sw{width:34px;height:19px;border-radius:20px;background:#C9D6DD;position:relative;flex:0 0 34px;transition:background .12s;}
    .sw i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
      box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .12s;}
    .sw.on{background:var(--inspire);} .sw.on i{left:17px;}
    .sw.lock{background:#E2E9ED;} .sw.lock i{background:#B7C6CE;}

    /* ---------- badges ---------- */
    .b{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 6px;
      font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;}
    .b.i{background:var(--inspire-soft);color:var(--ocean);}
    .b.c{background:var(--cultivate-soft);color:#256B6D;}
    .b.k{background:var(--kindle-soft);color:#8A5709;}
    .b.n{background:#EDF2F5;color:var(--muted);}
    .b.g{background:#E2F3E7;color:#1F6B39;}
    .b.r{background:#FBE7E7;color:#9B2C2C;}
    .b.dot::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}

    /* ---------- tables ---------- */
    table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
    .tbl th{text-align:left;font-weight:800;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
      color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);background:#FAFCFD;white-space:nowrap;}
    .tbl td{padding:8px 12px;border-bottom:1px solid #E7EEF2;vertical-align:middle;}
    .tbl tr:last-child td{border-bottom:0;}
    .tbl tr.hov:hover td{background:#F7FBFD;cursor:pointer;}
    .tbl tr.sel td{background:var(--inspire-soft);}
    .num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;}

    /* ---------- misc ---------- */
    .kpi{display:flex;flex-direction:column;gap:2px;}
    .kpi .l{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
    .kpi .v{font-size:22px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
    .kpi .d{font-size:11.5px;color:var(--muted);font-weight:600;}
    .prov{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:10.5px;
      font-weight:600;border-top:1px dashed var(--line);padding:8px 14px;}
    .prov .mono{font-size:10.5px;}
    .gate{display:flex;align-items:flex-start;gap:9px;border-radius:8px;padding:10px 12px;
      background:var(--kindle-soft);border:1px solid #EBCB94;color:#7A4E08;font-size:12px;font-weight:600;}
    .gate svg{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;stroke-width:1.9;fill:none;margin-top:1px;}
    .note{background:var(--inspire-soft);border:1px solid #B9DFF3;color:var(--ocean);border-radius:8px;
      padding:10px 12px;font-size:12px;font-weight:600;}
    .ev{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
    .ev.ob{color:#1F6B39;} .ev.co{color:var(--ocean);} .ev.inf{color:#8A5709;} .ev.as{color:#9B2C2C;}
    .bar{height:7px;border-radius:4px;background:#E7EEF2;overflow:hidden;}
    .bar i{display:block;height:100%;background:var(--inspire);}
    .empty{color:var(--muted);font-size:12px;padding:14px;text-align:center;}
    .sp{flex:1;}
    /* ---- dashboard vocabulary ported from Budget Report / Revenue Projection ---- */
    .kpirow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
    .kpic{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--inspire);
      border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:2px;}
    .kpic .lbl{font-size:11px;font-weight:700;color:var(--muted);}
    .kpic .val{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;}
    .kpic .sub{font-size:11px;color:var(--muted);font-weight:600;}
    .kpic .val.neg{color:#D9534F;} .kpic .val.pos{color:#2E8B57;}
    .schip{border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;border:1.5px solid;white-space:nowrap;}
    .schip.healthy{background:#EAF6EF;border-color:#2E8B57;color:#1F5E3A;}
    .schip.watch{background:#FDF3E3;border-color:#E59D33;color:#8A5A13;}
    .schip.shortfall{background:#FBECEB;border-color:#D9534F;color:#9C2F2B;}
    .schip.inactive{background:#F1F1EF;border-color:#CFCECA;color:#6B6A64;}
    .legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
    .legend .item{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;}
    .legend .item.off{opacity:.35;text-decoration:line-through;}
    .legend .sw{width:16px;height:4px;border-radius:2px;display:block;}
    .ctitle{font-size:11.5px;color:var(--muted);font-weight:600;margin:2px 0 6px;}
    .banner{display:flex;align-items:center;gap:9px;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;}
    .banner.warn{background:#FDF3E3;border:1.5px solid #E59D33;color:#8A5A13;}
    .sel-row{background:var(--inspire-soft);}
    .ckon{background:var(--inspire) !important;border-color:var(--inspire) !important;}
    .done{text-decoration:line-through;opacity:.45;}
    .lane{background:#EFF4F7;border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:8px;min-width:0;}
    .lane .lh{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 3px 2px;}
    .kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;}
    .kc:hover{border-color:var(--inspire);}
  

  html,body{background:var(--bg);}
  .app{width:100%;min-width:1300px;height:100vh;}
  .side{overflow:auto;}
  .ni{cursor:pointer;}
  .search{cursor:pointer;}
  @media (max-width:1200px){ body{overflow-x:auto;} }
</style>
