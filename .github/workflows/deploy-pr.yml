name: Deploy PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-pr:
    name: deploy-pr
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: uw-app-pr-${{ github.event.pull_request.number }}
      WORKER_URL: https://uw-app-pr-${{ github.event.pull_request.number }}.unfoldingword.workers.dev
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - name: Deploy the PR Worker
        working-directory: apps/uw-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --config ../../infra/uw-app/wrangler.toml --env staging
          --name "$WORKER_NAME" --var "COMMIT_SHA:$HEAD_SHA"
      - name: Confirm /health reports the PR head
        run: bash .github/scripts/await-health.sh "$WORKER_URL" "$HEAD_SHA"
      - name: Post the Worker URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- uw-app-pr-worker -->';
            const body = [
              marker,
              `**PR Worker:** \`${process.env.WORKER_NAME}\``,
              `**URL:** ${process.env.WORKER_URL}`,
              `**Commit:** \`${process.env.HEAD_SHA}\``,
              '',
              'Re-deployed on every push to this PR and deleted when the PR closes.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
