name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-source:
    name: Release Source
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop as the source of a PR into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          head="$HEAD_REF"
          echo "PR into main from '$head'"
          if [ "$head" != "develop" ]; then
            echo "::error::PRs into main must come from develop (a release). Open this PR against develop instead; an urgent fix goes through develop too."
            exit 1
          fi
          echo "ok"

  security-audit:
    name: security-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm audit:prod
      - run: pnpm audit:all

  lint:
    name: lint
    needs: [security-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:dates
      - run: pnpm lint:vendor
      - run: pnpm knip

  typecheck:
    name: typecheck
    needs: [security-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check

  architecture:
    name: architecture
    needs: [security-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm architecture
      - run: pnpm walk:all
      - run: pnpm trace:built

  test-shard:
    name: test (${{ matrix.part == 'sim' && 'scenarios' || format('shard {0} of 6', matrix.part) }})
    needs: [security-audit]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, sim]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      UW_SCREENS: required
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install the headless Chromium the screenshot check renders with
        run: pnpm --filter @uw/uw-app exec playwright install --with-deps --only-shell chromium
      - name: Apply every migration to an empty database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - name: Re-apply every migration, which must be a no-op
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - if: matrix.part != 'sim'
        run: pnpm test --shard=${{ matrix.part }}/6
      - name: Keep the pictures this run took, to compare by eye
        if: failure()
        run: pnpm screens:update
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screens-${{ matrix.part }}
          path: apps/uw-app/screens/pictures/
      - if: matrix.part == 'sim'
        run: pnpm sim:all

  test:
    name: test
    needs: [test-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Pass only when every shard passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test-shard.result }}
  build:
    name: build
    needs: [security-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Build the sandbox images the deploys roll out
        run: |
          docker build --platform linux/amd64 --tag sandbox-claude-code infra/containers/claude-code
          docker build --platform linux/amd64 --tag sandbox-codex infra/containers/codex
          docker run --rm --platform linux/amd64 sandbox-claude-code sh -c 'git --version && claude --version'
          docker run --rm --platform linux/amd64 sandbox-codex sh -c 'git --version && codex --version'
