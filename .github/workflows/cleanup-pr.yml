name: Cleanup PR Worker

on:
  pull_request_target:
    branches: [main]
    types: [closed]

concurrency:
  group: pr-worker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-pr:
    name: cleanup-pr
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: uw-app-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Skip unless the Cloudflare API token is set
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/secret-gate.sh CLOUDFLARE_API_TOKEN
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Delete the PR Worker
        if: steps.gate.outputs.configured == 'true'
        working-directory: apps/uw-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler delete --name "$WORKER_NAME" --force

  drop-neon-branch:
    name: drop-neon-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Skip unless the Neon API key is set
        id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bash .github/scripts/secret-gate.sh NEON_API_KEY
      - name: Drop the PR's Neon branch, if one was made
        if: steps.gate.outputs.configured == 'true'
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
