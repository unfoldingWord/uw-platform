name: Cleanup PR Worker

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup-pr:
    name: cleanup-pr
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: uw-app-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Delete the PR Worker
        working-directory: apps/uw-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler delete --name "$WORKER_NAME" --force
