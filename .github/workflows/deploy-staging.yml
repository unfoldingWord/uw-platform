name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate-staging:
    name: migrate-staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip unless the staging direct connection is set
        id: gate
        env:
          NEON_DIRECT_URL_STAGING: ${{ secrets.NEON_DIRECT_URL_STAGING }}
        run: bash .github/scripts/secret-gate.sh NEON_DIRECT_URL_STAGING
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Apply migrations to staging
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL_STAGING }}
        run: pnpm db:migrate

  deploy-staging:
    name: deploy-staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    needs: [migrate-staging]
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      STAGING_URL: https://uw-app-staging.unfoldingword.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip unless the Cloudflare API token is set
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/secret-gate.sh CLOUDFLARE_API_TOKEN
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Deploy staging
        if: steps.gate.outputs.configured == 'true'
        working-directory: apps/uw-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --config ../../infra/uw-app/wrangler.toml --env staging
          --var "COMMIT_SHA:$SHA"
      - name: Confirm /health/probe reports the deployed commit
        if: steps.gate.outputs.configured == 'true'
        run: bash .github/scripts/await-health.sh "$STAGING_URL/health/probe" "$SHA"

  deploy-ingest-staging:
    name: deploy-ingest-staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    needs: [migrate-staging]
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      INGEST_URL: https://uw-ingest-staging.unfoldingword.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/secret-gate.sh CLOUDFLARE_API_TOKEN
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Deploy uw-ingest to staging
        if: steps.gate.outputs.configured == 'true'
        working-directory: apps/uw-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --config ../../infra/uw-ingest/wrangler.toml --env staging
          --var "COMMIT_SHA:$SHA"
      - name: Confirm /health reports the deployed commit
        if: steps.gate.outputs.configured == 'true'
        run: bash .github/scripts/await-health.sh "$INGEST_URL/health" "$SHA"
