name: Deploy Staging

# Staging follows the develop branch only: it deploys after CI succeeds on a
# push to develop. A release PR (develop → main) runs CI with head branch
# develop too, so every job also requires the CI run to have been triggered by
# a push. Deploys are serialized (queued, never cancelled mid-migration), and
# each one first checks that its commit is still the tip of develop, so an
# older CI run finishing after a newer one skips instead of rolling staging back.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-tip:
    name: staging-tip
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-24.04
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Skip if a newer push to develop exists
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$REPO/commits/develop" --jq .sha)"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::Skipping: $HEAD_SHA is no longer the tip of develop ($tip). The newer push deploys instead."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok: $HEAD_SHA is the tip of develop"
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

  migrate-staging:
    name: migrate-staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      needs.staging-tip.outputs.current == 'true'
    needs: [staging-tip]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip unless the staging direct connection is set
        id: gate
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
        run: bash .github/scripts/secret-gate.sh DATABASE_URL_STAGING
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Open the database tunnel when one is configured
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_TUNNEL_HOST: ${{ vars.DATABASE_TUNNEL_HOST_STAGING }}
          DATABASE_TUNNEL_CLIENT_ID: ${{ secrets.DATABASE_TUNNEL_CLIENT_ID }}
          DATABASE_TUNNEL_CLIENT_SECRET: ${{ secrets.DATABASE_TUNNEL_CLIENT_SECRET }}
        run: bash .github/scripts/db-tunnel.sh
      - name: Apply migrations to staging
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: pnpm db:migrate

  deploy-staging:
    name: deploy-staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      needs.staging-tip.outputs.current == 'true'
    needs: [staging-tip, migrate-staging]
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      STAGING_URL: https://uw-app-staging.unfoldingword.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip unless the Cloudflare API token is set
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/secret-gate.sh CLOUDFLARE_API_TOKEN
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Deploy staging
        if: steps.gate.outputs.configured == 'true'
        working-directory: apps/uw-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --config ../../infra/uw-app/wrangler.toml --env staging
          --var "COMMIT_SHA:$SHA"
      - name: Confirm /health/probe reports the deployed commit
        if: steps.gate.outputs.configured == 'true'
        run: bash .github/scripts/await-health.sh "$STAGING_URL/health/probe" "$SHA"

  deploy-ingest-staging:
    name: deploy-ingest-staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      needs.staging-tip.outputs.current == 'true'
    needs: [staging-tip, migrate-staging]
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      INGEST_URL: https://uw-ingest-staging.unfoldingword.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/secret-gate.sh CLOUDFLARE_API_TOKEN
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Deploy uw-ingest to staging
        if: steps.gate.outputs.configured == 'true'
        working-directory: apps/uw-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --config ../../infra/uw-ingest/wrangler.toml --env staging
          --var "COMMIT_SHA:$SHA"
      - name: Confirm /health reports the deployed commit
        if: steps.gate.outputs.configured == 'true'
        run: bash .github/scripts/await-health.sh "$INGEST_URL/health" "$SHA"
