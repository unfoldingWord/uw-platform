name: Relabel Durable Object Storage

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment whose Durable Object classes are deleted (phase one)
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: relabel-storage-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  relabel-gate:
    name: relabel-gate
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      SHA: ${{ github.sha }}
      REF: ${{ github.ref }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Production runs only from a release tag on main; staging only from develop
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = staging ]; then
            [ "$REF" = refs/heads/develop ] || { echo "::error::Run staging from develop."; exit 1; }
            exit 0
          fi
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::Run production from a v* release tag."; exit 1 ;;
          esac
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$REF is not on main."; exit 1; }
      - name: Refuse unless the actor is listed in main's production-deployers
        run: bash .github/scripts/require-production-deployer.sh "$REPO" "$ACTOR"
      - name: Refuse unless every CI job succeeded on this commit
        run: bash .github/scripts/require-green-ci.sh "$REPO" "$SHA"

  delete-classes:
    name: delete-classes
    needs: [relabel-gate]
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.sha }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip unless the Cloudflare API token is set
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/secret-gate.sh CLOUDFLARE_API_TOKEN
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Rewrite this checkout's wrangler.toml as phase one, which stops at the delete migration
        if: steps.gate.outputs.configured == 'true'
        run: node tools/infra/relabel.ts config "$ENVIRONMENT" infra/uw-platform/wrangler.toml
      - name: Deploy phase one
        if: steps.gate.outputs.configured == 'true'
        working-directory: apps/uw-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --config ../../infra/uw-platform/wrangler.toml
          --env "$ENVIRONMENT" --var "COMMIT_SHA:$SHA"
      - name: Delete the container applications left without their Durable Object
        if: steps.gate.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" "$api/workers/durable_objects/namespaces?per_page=1000" > "$RUNNER_TEMP/namespaces.json"
          curl -fsS -H "$auth" "$api/containers/applications" > "$RUNNER_TEMP/apps.json"
          node tools/infra/relabel.ts orphans "$ENVIRONMENT" infra/uw-platform/wrangler.toml \
            "$RUNNER_TEMP/namespaces.json" "$RUNNER_TEMP/apps.json" > "$RUNNER_TEMP/orphans.txt"
          while read -r id; do
            curl -fsS -X DELETE -H "$auth" "$api/containers/applications/$id" > /dev/null
            echo "deleted container application $id"
          done < "$RUNNER_TEMP/orphans.txt"
