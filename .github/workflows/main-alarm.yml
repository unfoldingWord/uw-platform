name: Main Alarm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

concurrency:
  group: main-alarm-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  main-alarm:
    name: main-alarm
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const branch = run.head_branch;
            const label = `ci-red-${branch}`;
            const consequence = branch === 'develop'
              ? 'Staging is frozen on the last green commit'
              : 'Releases to production are blocked';
            const { owner, repo } = context.repo;
            const open = (
              await github.paginate(github.rest.issues.listForRepo, { owner, repo, labels: label, state: 'open' })
            ).filter((issue) => !issue.pull_request);
            const commit = `\`${run.head_sha.slice(0, 7)}\``;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'b60205',
                description: `CI is red on ${branch}; ${consequence.toLowerCase()}`,
              });
            }
            if (run.conclusion === 'success') {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `CI is green again on \`${branch}\` at ${commit}: ${run.html_url}. ${branch === 'develop' ? 'Staging deploys resume.' : 'Releases can go out again.'}`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            if (!['failure', 'timed_out', 'startup_failure'].includes(run.conclusion)) {
              core.info(`CI concluded ${run.conclusion}; nothing to raise.`);
              return;
            }
            const body = [
              `CI failed on \`${branch}\` at ${commit} (${run.head_commit?.message?.split('\n')[0] ?? 'no message'}).`,
              '',
              `Failing run: ${run.html_url}`,
              '',
              `${consequence} until CI is green on \`${branch}\` again; this issue closes itself then.`,
            ].join('\n');
            if (open.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: `CI is red on ${branch} at ${run.head_sha.slice(0, 7)}`, body, labels: [label] });
            }
