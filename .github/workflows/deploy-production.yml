name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  production-gate:
    name: production-gate
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      SHA: ${{ github.sha }}
      REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release tag on main
        run: |
          set -euo pipefail
          echo "Dispatched on $REF ($SHA)"
          case "$REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Production deploys only from a v* release tag. Re-run with: gh workflow run deploy-production.yml --ref v<version>"
              exit 1 ;;
          esac
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tag ${REF#refs/tags/} points at $SHA, which is not on main. Tag the release commit on main."
            exit 1
          fi
          echo "ok: ${REF#refs/tags/} is on main"
      - name: Refuse unless the actor is listed in main's production-deployers
        run: bash .github/scripts/require-production-deployer.sh "$REPO" "$ACTOR"
      - name: Refuse unless every CI job succeeded on this commit
        run: bash .github/scripts/require-green-ci.sh "$REPO" "$SHA"

  migrate-production:
    name: migrate-production
    runs-on: ubuntu-24.04
    needs: [production-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Skip unless the production direct connection is set
        id: gate
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: bash .github/scripts/secret-gate.sh DATABASE_URL_PRODUCTION
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Open the database tunnel when one is configured
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_TUNNEL_HOST: ${{ vars.DATABASE_TUNNEL_HOST_PRODUCTION }}
          DATABASE_TUNNEL_CLIENT_ID: ${{ secrets.DATABASE_TUNNEL_CLIENT_ID }}
          DATABASE_TUNNEL_CLIENT_SECRET: ${{ secrets.DATABASE_TUNNEL_CLIENT_SECRET }}
        run: bash .github/scripts/db-tunnel.sh
      - name: Apply migrations to production
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: pnpm db:migrate

  deploy-production:
    name: deploy-production
    needs: [production-gate, migrate-production]
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip unless the Cloudflare API token is set
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/secret-gate.sh CLOUDFLARE_API_TOKEN
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Deploy production
        if: steps.gate.outputs.configured == 'true'
        working-directory: apps/uw-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --config ../../infra/uw-app/wrangler.toml --env production
          --var "COMMIT_SHA:$SHA"

  deploy-ingest-production:
    name: deploy-ingest-production
    needs: [production-gate, migrate-production]
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/secret-gate.sh CLOUDFLARE_API_TOKEN
      - if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup
      - name: Deploy uw-ingest to production
        if: steps.gate.outputs.configured == 'true'
        working-directory: apps/uw-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --config ../../infra/uw-ingest/wrangler.toml --env production
          --var "COMMIT_SHA:$SHA"
