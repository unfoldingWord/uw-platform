name = "uw-ingest"
main = "../../apps/uw-ingest/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
COMMIT_SHA = "unknown"

[observability]
enabled = true

[env.staging]
name = "uw-ingest-staging"
workers_dev = true
logpush = true

[env.staging.vars]
COMMIT_SHA = "unknown"

[env.staging.observability]
enabled = true

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "621c03bdb5ef4087a2a64f1e411779c8"

[[env.staging.queues.producers]]
binding = "INGEST_QUEUE"
queue = "uw-ingest-events-staging"

[[env.staging.secrets_store_secrets]]
binding = "STORE_GITHUB_WEBHOOK_SECRET"
store_id = "set-at-go-live"
secret_name = "UW_STAGING_GITHUB_WEBHOOK_SECRET"

[[env.staging.secrets_store_secrets]]
binding = "STORE_ZULIP_WEBHOOK_TOKEN"
store_id = "set-at-go-live"
secret_name = "UW_STAGING_ZULIP_WEBHOOK_TOKEN"

[env.production]
name = "uw-ingest"
workers_dev = true
logpush = true

[env.production.vars]
COMMIT_SHA = "unknown"

[env.production.observability]
enabled = true

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "2564258906e94905b1b28d0c28002ff6"

[[env.production.queues.producers]]
binding = "INGEST_QUEUE"
queue = "uw-ingest-events-production"

[[env.production.secrets_store_secrets]]
binding = "STORE_GITHUB_WEBHOOK_SECRET"
store_id = "set-at-go-live"
secret_name = "UW_PRODUCTION_GITHUB_WEBHOOK_SECRET"

[[env.production.secrets_store_secrets]]
binding = "STORE_ZULIP_WEBHOOK_TOKEN"
store_id = "set-at-go-live"
secret_name = "UW_PRODUCTION_ZULIP_WEBHOOK_TOKEN"
