name = "uw-platform"
main = "../../apps/uw-platform/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
COMMIT_SHA = "unknown"
ENVIRONMENT = "local"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "HARNESS_HUB"
class_name = "HarnessHub"

[[durable_objects.bindings]]
name = "PAGE_DRAFT"
class_name = "PageDraft"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HarnessHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ClaudeCodeSandbox", "CodexSandbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PageDraft"]

