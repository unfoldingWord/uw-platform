name = "uw-app"
main = "../../apps/uw-app/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
COMMIT_SHA = "unknown"
ENVIRONMENT = "local"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "HARNESS_HUB"
class_name = "HarnessHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HarnessHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ClaudeCodeSandbox", "CodexSandbox"]

[env.staging]
name = "uw-app-staging"
workers_dev = true
logpush = true

[env.staging.vars]
COMMIT_SHA = "unknown"
ENVIRONMENT = "staging"
ACCESS_TEAM_DOMAIN = "https://unfoldingword.cloudflareaccess.com"
ACCESS_AUD = "3ff80cba422e08ef65f46e9207c91322ec1de57bc578d244d30e865e22c9bd79"
ACCESS_MCP_AUD = "3f4fa24cb33c59c0577b4d3e4505b5c43c8648b4f65ddea3d9679859c7742337"
APP_ORIGIN = "https://uw-app-staging.unfoldingword.workers.dev"
VAPID_PUBLIC_KEY = "set-at-go-live"
VAPID_SUBJECT = "set-at-go-live"
ZULIP_SITE = "set-at-go-live"
ZULIP_BOT_EMAIL = "set-at-go-live"
ZULIP_CHANNELS = "{}"

[env.staging.observability]
enabled = true

[env.staging.triggers]
crons = ["17 3 * * *", "* * * * *"]

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "621c03bdb5ef4087a2a64f1e411779c8"

[[env.staging.queues.consumers]]
queue = "uw-ingest-events-staging"
max_retries = 3
dead_letter_queue = "uw-ingest-events-staging-dlq"

[[env.staging.queues.producers]]
binding = "INGEST_DLQ"
queue = "uw-ingest-events-staging-dlq"

[[env.staging.durable_objects.bindings]]
name = "HARNESS_HUB"
class_name = "HarnessHub"

[[env.staging.workflows]]
name = "harness-run-staging"
binding = "HARNESS_RUN"
class_name = "HarnessRun"

[[env.staging.containers]]
class_name = "ClaudeCodeSandbox"
image = "../containers/claude-code/Dockerfile"
max_instances = 4

[[env.staging.containers]]
class_name = "CodexSandbox"
image = "../containers/codex/Dockerfile"
max_instances = 4

[[env.staging.durable_objects.bindings]]
name = "CLAUDE_CODE_SANDBOX"
class_name = "ClaudeCodeSandbox"

[[env.staging.durable_objects.bindings]]
name = "CODEX_SANDBOX"
class_name = "CodexSandbox"

[env.production]
name = "uw-app"
workers_dev = true
logpush = true

[env.production.vars]
COMMIT_SHA = "unknown"
ENVIRONMENT = "production"
ACCESS_TEAM_DOMAIN = "https://unfoldingword.cloudflareaccess.com"
